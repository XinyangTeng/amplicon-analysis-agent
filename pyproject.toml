[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplicon-analysis-agent"
version = "0.3.0"
description = "Auditable MCP agent for amplicon microbiome analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "mcp>=1.27,<2",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
test = [
  "pytest>=8,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
amplicon-agent = "amplicon_agent.mcp_server:main"
amplicon-web = "amplicon_agent.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplicon_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
