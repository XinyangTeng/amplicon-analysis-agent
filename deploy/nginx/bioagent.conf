server {
    listen 80;
    listen [::]:80;
    server_name bioagent.txyandsby.cn;

    # The application has its own upload quota. This is the reverse-proxy cap.
    client_max_body_size 250m;

    # Keep ACME validation outside the application proxy so HTTPS renewal does
    # not depend on the Python service being healthy.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bioagent-acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }
}
